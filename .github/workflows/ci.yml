name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The smoke suite runs against the real out/ build.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: e2e/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

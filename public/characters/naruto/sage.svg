<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Ninja standing in sage mode, toad eyes open, red cloak">
  <title>Sage mode</title>
  <defs>
    <linearGradient id="s-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe885"/>
      <stop offset="1" stop-color="#f3b62f"/>
    </linearGradient>
    <linearGradient id="s-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa9332"/>
      <stop offset="1" stop-color="#dd6c11"/>
    </linearGradient>
    <linearGradient id="s-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8352c"/>
      <stop offset="1" stop-color="#a21c17"/>
    </linearGradient>
    <linearGradient id="s-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#9aa5b3"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="226" rx="46" ry="8" fill="#000" opacity=".25"/>

  <!-- cloak behind, flaring -->
  <path d="M120 112c-22 0-34 8-40 24l-14 54 20-6 6 18 14-10 14 10 6-18 20 6-14-54c-6-16-18-24-40-24z" fill="url(#s-cloak)"/>
  <path d="M120 112c-22 0-34 8-40 24l-6 24 12-4 8-34c6-6 15-9 26-9s20 3 26 9l8 34 12 4-6-24c-6-16-18-24-40-24z" fill="#7e1210" opacity=".45"/>
  <!-- cloak hem -->
  <path d="M66 190l20-6 6 18 14-10 14 10 6-18 20 6 3 10-23-6-6 16-14-10-14 10-6-16-23 6z" fill="#2f4576"/>

  <!-- legs -->
  <path d="M104 176h12v44h-12zM124 176h12v44h-12z" fill="url(#s-coat)"/>
  <path d="M100 216h20v10h-20zM120 216h20v10h-20z" fill="#2f4576"/>

  <!-- torso -->
  <path d="M94 176c-2-34 3-50 26-50s28 16 26 50z" fill="url(#s-coat)"/>
  <path d="M120 130v46" stroke="#b4510a" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M104 127c5 10 11 15 16 15s11-5 16-15c-5-2-10-3-16-3s-11 1-16 3z" fill="#2f4576"/>

  <!-- arms crossed, ready -->
  <path d="M96 140c-10 10-10 24-2 30l14-6" fill="none" stroke="url(#s-coat)" stroke-width="16" stroke-linecap="round"/>
  <path d="M144 140c10 10 10 24 2 30l-14-6" fill="none" stroke="url(#s-coat)" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 162h40v13H100z" fill="url(#s-coat)" transform="rotate(-6 120 168)"/>
  <ellipse cx="103" cy="170" rx="9" ry="7" fill="#f3c396"/>
  <ellipse cx="137" cy="170" rx="9" ry="7" fill="#f3c396"/>

  <!-- neck + head -->
  <path d="M112 112h16v16h-16z" fill="#e0a877"/>
  <circle cx="120" cy="86" r="34" fill="#f3c396"/>

  <!-- spiky hair, wilder and standing up -->
  <path d="M83 84 L66 48 L91 70 L85 30 L106 63 L110 24 L120 56 L130 24 L134 63 L155 30 L149 70 L174 48 L157 84 C153 60 140 50 120 50 C100 50 87 60 83 84 Z" fill="url(#s-hair)"/>
  <path d="M96 64c5-8 13-12 24-12s19 4 24 12c-4-12-14-18-24-18s-20 6-24 18z" fill="#fff" opacity=".22"/>

  <!-- headband -->
  <path d="M84 70h72v13H84z" fill="#2a3a5e"/>
  <rect x="98" y="67" width="44" height="18" rx="4" fill="url(#s-plate)"/>
  <g fill="none" stroke="#5a6472" stroke-width="2.2" stroke-linecap="round">
    <path d="M125 72c-4-2-10-2-12 2s-1 8 3 9 7-2 6-5"/>
    <path d="M117 82l-5 5"/>
  </g>

  <!-- sage pigment around the eyes -->
  <path d="M95 92c0-6 5-10 11-10 5 0 8 2 10 6l-2 8c-3 4-7 6-11 6-5 0-8-4-8-10z" fill="#e8862c" opacity=".85"/>
  <path d="M145 92c0-6-5-10-11-10-5 0-8 2-10 6l2 8c3 4 7 6 11 6 5 0 8-4 8-10z" fill="#e8862c" opacity=".85"/>

  <!-- toad eyes: amber iris, horizontal pupil -->
  <ellipse cx="107" cy="93" rx="8.5" ry="7" fill="#fff6e0"/>
  <ellipse cx="133" cy="93" rx="8.5" ry="7" fill="#fff6e0"/>
  <ellipse cx="107" cy="93" rx="6" ry="5.5" fill="#f2b705"/>
  <ellipse cx="133" cy="93" rx="6" ry="5.5" fill="#f2b705"/>
  <rect x="101" y="91" width="12" height="4" rx="2" fill="#2b1b0e"/>
  <rect x="127" y="91" width="12" height="4" rx="2" fill="#2b1b0e"/>

  <!-- whisker marks, thicker in sage mode -->
  <g stroke="#b9764c" stroke-width="2.6" stroke-linecap="round">
    <path d="M88 95h10M88 101h10M89 107h9"/>
    <path d="M142 95h10M142 101h10M142 107h9"/>
  </g>

  <!-- determined mouth -->
  <path d="M113 110c4 3 10 3 14 0" fill="none" stroke="#3a2a1e" stroke-width="2.6" stroke-linecap="round"/>
</svg>
